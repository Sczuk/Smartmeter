spring.application.name=SmartMeter

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${PROVISIONING_SERVICE_PORT}

keycloak.base-url=http://localhost:9080
keycloak.realm=smartmeter
keycloak.admin.client-id=register-service
keycloak.admin.client-secret=${KEYCLOAK_REGISTER_SECRET:register-service-dev-secret}
keycloak.login.client-id=smartmeter-api-login
keycloak.login.client-secret=${KEYCLOAK_LOGIN_SECRET:smartmeter-api-login-dev-secret}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.base-url}/realms/${keycloak.realm}
spring.security.oauth2.resourceserver.jwt.audiences=smartmeter-api

springdoc.swagger-ui.oauth.client-id=smartmeter-api-docs
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid
springdoc.swagger-ui.urls[0].name=provisioningService
springdoc.swagger-ui.urls[0].url=/v3/api-docs

springdoc.swagger-ui.urls[1].name=energyIotService
springdoc.swagger-ui.urls[1].url=http://localhost:8081/v3/api-docs

energy-iot.url=${ENERGY-IOT_URL}