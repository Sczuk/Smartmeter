spring.application.name=energy-iot-service

spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}

app.mqtt.host=tcp://localhost:1883
app.mqtt.client-id=spring-mqtt-client

app.mqtt.inboundTopic.measurements=smartmeter/%s/measurements

#topico abaixo é o topico para o smartmeter confirmar que foi configurado corretamente
app.mqtt.inboundTopic.smartmeterConfig=smartmeter/config/smartmeter/%s

app.mqtt.outboundTopic.deviceCommand=smartmeter/%s/device/command
app.mqtt.outboundTopic.deviceConfig=smartmeter/%s/config/device
app.mqtt.outboundTopic.smartmeterConfig=smartmeter/config/smartmeter/%s

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9080/realms/smartmeter
spring.security.oauth2.resourceserver.jwt.audiences=smartmeter-api
keycloak.base-url=http://localhost:9080
keycloak.realm=smartmeter

springdoc.swagger-ui.oauth.client-id=smartmeter-api-docs
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.scopes=openid

mqtt.broker.user=${BROKER_USER}
mqtt.broker.password=${BROKER_PASSWORD}

server.port=${ENERGY_IOT_PORT}

spring.docker.compose.enabled=false